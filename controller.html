<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cherry Remote - Canvas Controller</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #07090e; font-family: sans-serif; color: #fff; }

    .portal-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

    .hud-header {
      height: 60px; padding: 0 16px; background: rgba(11, 15, 25, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15); display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .brand-title { font-size: 13px; font-weight: 800; color: #d90429; }
    
    .ip-display-box { font-family: monospace; font-size: 11px; color: #00e5ff; background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 6px; }

    .pairing-bar { display: flex; align-items: center; gap: 8px; }
    .pin-box {
      background: rgba(255, 255, 255, 0.08); border: 1.5px solid #d90429; color: #fff; padding: 4px 8px;
      font-size: 13px; font-weight: bold; border-radius: 8px; text-align: center; width: 60px;
      font-family: monospace; outline: none;
    }
    .status-pill {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px; border-radius: 20px; font-family: monospace; font-size: 11px; font-weight: 700; color: #00e5ff;
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 8px #10b981; }

    .app-shelf-overlay {
      flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px;
    }

    .custom-url-box { display: flex; gap: 8px; width: 100%; max-width: 600px; margin: 0 auto; }
    .url-input {
      flex: 1; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 12px;
      padding: 12px; color: #fff; font-size: 12px; outline: none;
    }
    .btn-play-custom {
      background: #d90429; border: none; border-radius: 12px; padding: 0 16px; color: #fff;
      font-weight: 800; cursor: pointer; font-size: 12px;
    }

    .app-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 600px; margin: 0 auto;
    }
    .app-card {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px; height: 95px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; cursor: pointer;
    }
    .app-card:active { background: rgba(217, 4, 41, 0.2); border-color: #d90429; }
    .app-card .icon-emoji { font-size: 24px; }
    .app-card span.title { font-size: 11px; font-weight: 800; color: #fff; }

    .btn-action-row { grid-column: span 3; display: flex; margin-top: 6px; }
    .btn-ctrl {
      flex: 1; padding: 14px; border-radius: 14px; font-size: 12px; font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; cursor: pointer;
      background: rgba(217, 4, 41, 0.4); text-align: center;
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <div class="hud-header">
      <div class="brand-title">CHERRY REMOTE</div>
      <div class="ip-display-box">192.168.0.107</div>

      <div class="pairing-bar">
        <input id="pin" class="piin-box" class="pin-box" type="number" placeholder="PIN" maxlength="4" oninput="autoPair()" />
        <div class="status-pill">
          <div id="dot" class="status-dot"></div>
          <span id="statusText">PAIR</span>
        </div>
      </div>
    </div>

    <div class="app-shelf-overlay">
      <div class="custom-url-box">
        <input id="streamUrlInput" class="url-input" type="url" placeholder="Paste direct .m3u8 or video stream URL..." />
        <button class="btn-play-custom" onclick="sendCustomStream()">PUSH</button>
      </div>

      <div class="app-grid">
        <div class="app-card" onclick="sendPresetStream('https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8')">
          <span class="icon-emoji">🍿</span><span class="title">Test Stream</span>
        </div>
        <div class="app-card" onclick="sendPresetStream('https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_1MB.mp4')">
          <span class="icon-emoji">🐇</span><span class="title">Big Buck</span>
        </div>
        <div class="app-card" onclick="sendPresetStream('https://cph-msl.akamaized.net/hls/live/2000341/test/master.m3u8')">
          <span class="icon-emoji">🌐</span><span class="title">Live HLS</span>
        </div>

        <div class="btn-action-row">
          <button class="btn-ctrl" onclick="send('HOME', '')">🏠 Reset to Dashboard</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let client = null;
    let topic = '';

    function autoPair() {
      const pinVal = document.getElementById('pin').value;
      if (pinVal.length === 4) {
        topic = 'cherry_portal_' + pinVal;
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
          document.getElementById('dot').classList.add('active');
          document.getElementById('statusText').innerText = 'READY';
        });

        client.on('offline', () => {
          document.getElementById('dot').classList.remove('active');
          document.getElementById('statusText').innerText = 'PAIR';
        });
      }
    }

    function sendCustomStream() {
      const url = document.getElementById('streamUrlInput').value;
      if (url) { send('LAUNCH', url); } 
      else { alert("Paste a stream URL first!"); }
    }

    function sendPresetStream(url) {
      document.getElementById('streamUrlInput').value = url;
      send('LAUNCH', url);
    }

    function send(type, url) {
      if (client && client.connected) {
        const fullWsUrl = `ws://192.168.0.107:8443/video`;
        client.publish(topic, JSON.stringify({ type, url: fullWsUrl }));
      } else {
        alert("Enter the 4-digit PIN from your Tesla screen first!");
      }
    }
  </script>
</body>
</html>
