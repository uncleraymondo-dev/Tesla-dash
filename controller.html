<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Phone Controller</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
    h2 { margin-bottom: 20px; color: #00e5ff; }
    
    .pin-input {
      background: #1e293b; border: 2px solid #00e5ff; color: #fff; padding: 12px;
      font-size: 22px; font-weight: bold; border-radius: 12px; text-align: center;
      width: 160px; margin-bottom: 12px; font-family: monospace; letter-spacing: 2px;
    }

    .btn {
      background: #1e293b; border: 1px solid rgba(255,255,255,0.1); color: #fff;
      padding: 16px; font-size: 16px; font-weight: bold; border-radius: 14px;
      margin: 8px 0; width: 100%; cursor: pointer;
    }
    .btn:active { background: #00e5ff; color: #000; }
    .status-badge { background: #991b1b; color: #f87171; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>

  <h2>Tesla Controller</h2>
  
  <div>
    <input id="pinInput" class="pin-input" type="number" placeholder="PIN" maxlength="4" />
    <br>
    <button class="btn" style="background:#007aff; width:160px;" onclick="connectToCar()">Connect</button>
  </div>
  <br>

  <div id="status" class="status-badge">Not Connected</div>

  <button class="btn" onclick="sendAction('LOAD_URL', 'https://www.youtube.com')">▶️ Launch YouTube</button>
  <button class="btn" onclick="sendAction('LOAD_URL', 'https://twitch.tv')">👾 Launch Twitch</button>
  <button class="btn" onclick="sendAction('LOAD_URL', 'https://play.2048.co')">🎮 Launch Game 2048</button>
  <button class="btn" onclick="sendAction('GO_HOME', '')" style="background: #991b1b;">🏠 Return to Home</button>

  <script>
    const peer = new Peer();
    let conn = null;

    function connectToCar() {
      const pin = document.getElementById('pinInput').value;
      if (!pin) return alert("Enter the PIN shown on your Tesla screen");

      const targetPeerId = 'tesla-mcu2-' + pin;
      conn = peer.connect(targetPeerId);

      conn.on('open', () => {
        const badge = document.getElementById('status');
        badge.innerText = 'Paired with Tesla!';
        badge.style.background = '#065f46';
        badge.style.color = '#34d399';
      });

      conn.on('close', () => {
        const badge = document.getElementById('status');
        badge.innerText = 'Disconnected';
        badge.style.background = '#991b1b';
        badge.style.color = '#f87171';
      });
    }

    function sendAction(type, url) {
      if (conn && conn.open) {
        conn.send({ type, url });
      } else {
        alert("Connect using the 4-digit Tesla PIN first!");
      }
    }
  </script>
</body>
</html>
