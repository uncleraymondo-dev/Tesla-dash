<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cherry Berry Remote</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --cherry-red: #d90429;
      --text: #111827;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; padding: 20px; text-align: center; }

    h2 { font-weight: 800; letter-spacing: 1px; margin-bottom: 14px; color: var(--cherry-red); }
    
    .pin-box {
      background: #ffffff; border: 2px solid var(--cherry-red); color: #111; padding: 10px;
      font-size: 24px; font-weight: bold; border-radius: 12px; text-align: center; width: 140px;
      font-family: monospace; letter-spacing: 4px; outline: none; margin-bottom: 10px;
    }

    .status-badge { background: #fee2e2; color: #991b1b; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; display: inline-block; margin-bottom: 16px; }
    .status-badge.connected { background: #d1fae5; color: #065f46; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    
    .btn {
      background: var(--card-bg); border: 1px solid rgba(0,0,0,0.08); color: var(--text);
      padding: 16px 10px; font-size: 14px; font-weight: 700; border-radius: 14px; display: flex;
      flex-direction: column; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .btn:active { background: var(--cherry-red); color: #fff; }
    .btn-full { grid-column: span 2; background: #0284c7; color: #fff; }
    .btn-home { grid-column: span 2; background: var(--cherry-red); color: #fff; }
  </style>
</head>
<body>

  <h2>CHERRY BERRY REMOTE</h2>

  <input id="pin" class="pin-box" type="number" placeholder="PIN" maxlength="4" />
  <br>
  <button class="btn btn-full" style="padding:10px;" onclick="connectRemote()">Connect Instant Remote</button>
  <br>
  <div id="status" class="status-badge">Offline</div>

  <div class="grid">
    <div class="btn" onclick="send('LAUNCH', 'https://www.youtube.com')"><span>▶️</span>YouTube</div>
    <div class="btn" onclick="send('LAUNCH', 'https://www.netflix.com')"><span>🎬</span>Netflix</div>
    <div class="btn" onclick="send('LAUNCH', 'https://www.primevideo.com')"><span>📦</span>Prime Video</div>
    <div class="btn" onclick="send('LAUNCH', 'https://www.disneyplus.com')"><span>✨</span>Disney+</div>
    <div class="btn" onclick="send('LAUNCH', 'https://www.twitch.tv')"><span>👾</span>Twitch</div>
    <div class="btn" onclick="send('LAUNCH', 'https://open.spotify.com')"><span>🎵</span>Spotify</div>
    
    <div class="btn btn-full" onclick="send('FULLSCREEN', '')">🖥️ Trigger Fullscreen</div>
    <div class="btn btn-home" onclick="send('HOME', '')">🏠 Return to Portal Home</div>
  </div>

  <script>
    let client = null;
    let topic = '';

    function connectRemote() {
      const pinVal = document.getElementById('pin').value;
      if (!pinVal) return alert("Enter the 4-digit PIN showing on your Tesla screen");

      topic = 'cherry_portal_' + pinVal;
      client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

      client.on('connect', () => {
        const badge = document.getElementById('status');
        badge.innerText = 'Paired & Ready!';
        badge.classList.add('connected');
      });

      client.on('offline', () => {
        const badge = document.getElementById('status');
        badge.innerText = 'Disconnected';
        badge.classList.remove('connected');
      });
    }

    function send(type, url) {
      if (client && client.connected) {
        client.publish(topic, JSON.stringify({ type, url }));
      } else {
        alert("Enter the PIN and tap Connect Instant Remote first!");
      }
    }
  </script>
</body>
</html>
