<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cherry Remote - Canvas Controller</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --cherry-red: #d90429;
      --accent-blue: #00e5ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: sans-serif; color: #fff; }

    .portal-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; }

    .hud-header {
      height: 55px; padding: 0 16px; background: rgba(11, 15, 25, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(14px); z-index: 10;
    }
    .brand-title { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; color: var(--cherry-red); }
    
    .ip-selector-wrapper { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: bold; }
    .ip-dropdown {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff; padding: 3px 6px; border-radius: 6px; font-family: monospace; outline: none;
    }
    .ip-dropdown option { background: #0b0f19; color: #fff; }

    .pairing-bar { display: flex; align-items: center; gap: 8px; }
    .pin-box {
      background: rgba(255, 255, 255, 0.08); border: 1.5px solid var(--cherry-red); color: #fff; padding: 4px 8px;
      font-size: 13px; font-weight: bold; border-radius: 8px; text-align: center; width: 60px;
      font-family: monospace; outline: none;
    }
    .status-pill {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px; border-radius: 20px; font-family: monospace; font-size: 11px; font-weight: 700; color: var(--accent-blue);
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 8px #10b981; }

    .app-shelf-overlay {
      position: relative; z-index: 5; flex: 1; overflow-y: auto; padding: 40px 12px 30px 12px;
    }

    .custom-url-box {
      display: flex; gap: 6px; margin-bottom: 20px; width: 100%; max-width: 600px; margin: 0 auto 20px auto;
    }
    .url-input {
      flex: 1; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 12px;
      padding: 12px; color: #fff; font-size: 12px; outline: none;
    }
    .btn-play-custom {
      background: var(--cherry-red); border: none; border-radius: 12px; padding: 0 16px; color: #fff;
      font-weight: 800; cursor: pointer; font-size: 12px;
    }
    .btn-play-custom:active { transform: scale(0.95); }

    .app-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 600px; margin: 0 auto;
    }

    .app-card {
      background: transparent; border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px; height: 95px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; cursor: pointer;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.4), 0 6px 18px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
    }
    .app-card:active {
      transform: scale(0.94); background: rgba(217, 4, 41, 0.15); border-color: var(--cherry-red);
    }
    .app-card .icon-emoji { font-size: 24px; }
    .app-card span.title { font-size: 11px; font-weight: 800; color: #fff; }

    .btn-action-row { grid-column: span 3; display: flex; gap: 8px; margin-top: 10px; }
    .btn-ctrl {
      flex: 1; padding: 14px; border-radius: 14px; font-size: 12px; font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      background: rgba(217, 4, 41, 0.4);
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <div class="hud-header">
      <div class="brand-title">CHERRY REMOTE</div>

      <div class="ip-selector-wrapper">
        <span>IP:</span>
        <select id="remoteIpSelect" class="ip-dropdown">
          <option value="192.168.0.107" selected>192.168.0.107</option>
          <option value="192.168.43.1">192.168.43.1</option>
          <option value="192.168.50.1">192.168.50.1</option>
          <option value="10.0.0.1">10.0.0.1</option>
          <option value="127.0.0.1">127.0.0.1</option>
        </select>
      </div>

      <div class="pairing-bar">
        <input id="pin" class="pin-box" type="number" placeholder="PIN" maxlength="4" oninput="autoPair()" />
        <div class="status-pill">
          <div id="dot" class="status-dot"></div>
          <span id="statusText">PAIR</span>
        </div>
      </div>
    </div>

    <div class="app-shelf-overlay">
      <div class="custom-url-box">
        <input id="streamUrlInput" class="url-input" type="url" placeholder="Paste direct .m3u8 or video stream URL..." />
        <button class="btn-play-custom" onclick="sendCustomStream()">PUSH STREAM</button>
      </div>

      <div class="app-grid">
        <div class="app-card" onclick="sendPresetStream('https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8')">
          <span class="icon-emoji">🍿</span><span class="title">Test Stream</span>
        </div>
        <div class="app-card" onclick="sendPresetStream('https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_1MB.mp4')">
          <span class="icon-emoji">🐇</span><span class="title">Big Buck</span>
        </div>
        <div class="app-card" onclick="sendPresetStream('https://cph-msl.akamaized.net/hls/live/2000341/test/master.m3u8')">
          <span class="icon-emoji">🌐</span><span class="title">Live HLS</span>
        </div>

        <div class="btn-action-row">
          <button class="btn-ctrl" onclick="send('HOME', '')">🏠 Reset to Dashboard</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let client = null;
    let topic = '';

    function autoPair() {
      const pinVal = document.getElementById('pin').value;
      if (pinVal.length === 4) {
        topic = 'cherry_portal_' + pinVal;
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
          document.getElementById('dot').classList.add('active');
          document.getElementById('statusText').innerText = 'READY';
        });

        client.on('offline', () => {
          document.getElementById('dot').classList.remove('active');
          document.getElementById('statusText').innerText = 'PAIR';
        });
      }
    }

    function sendCustomStream() {
      const url = document.getElementById('streamUrlInput').value;
      if (url) {
        send('LAUNCH', url);
      } else {
        alert("Please paste a valid stream URL first!");
      }
    }

    function sendPresetStream(url) {
      document.getElementById('streamUrlInput').value = url;
      send('LAUNCH', url);
    }

    function send(type, url) {
      if (client && client.connected) {
        const selectedIp = document.getElementById('remoteIpSelect').value;
        const fullWsUrl = `ws://${selectedIp}:8443/video`;
        client.publish(topic, JSON.stringify({ type, url: fullWsUrl }));
      } else {
        alert("Enter the 4-digit PIN showing on your Tesla screen first!");
      }
    }
  </script>
</body>
</html>
