<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Remote Receiver</title>

  <!-- PeerJS Engine (Free WebRTC Data Connection) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: -apple-system, sans-serif; color: #fff; }

    .dashboard { display: flex; flex-direction: column; width: 100%; height: 100%; }
    
    .header {
      height: 70px; background: rgba(18, 24, 38, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .brand { font-size: 22px; font-weight: 800; color: #00e5ff; }
    .pin-badge { font-size: 18px; font-weight: 800; background: #1e293b; padding: 6px 14px; border-radius: 10px; color: #34c759; font-family: monospace; }

    .content-area { flex: 1; position: relative; overflow: hidden; }
    
    .grid {
      position: absolute; inset: 0; padding: 30px; display: grid;
      grid-template-columns: repeat(3, 1fr); gap: 20px; align-content: center;
    }
    .card {
      background: rgba(22, 30, 46, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px; height: 120px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 16px;
      cursor: pointer;
    }
    .card span { font-size: 32px; }

    #activeFrame { width: 100%; height: 100%; border: none; display: none; background: #000; }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <div class="brand">TESLA DASH PORTAL</div>
      <div class="pin-badge">PAIR PIN: <span id="carPin">Generating...</span></div>
    </div>

    <div class="content-area">
      <!-- Dashboard App Grid -->
      <div id="appGrid" class="grid">
        <div class="card" onclick="launchApp('https://www.youtube.com')"><span>▶️</span>YouTube</div>
        <div class="card" onclick="launchApp('https://twitch.tv')"><span>👾</span>Twitch</div>
        <div class="card" onclick="launchApp('https://play.2048.co')"><span>🎮</span>Game 2048</div>
      </div>

      <!-- Remote Stream Viewport -->
      <iframe id="activeFrame"></iframe>
    </div>
  </div>

  <script>
    // Generate a random 4-digit room code (e.g. 8492)
    const pin = Math.floor(1000 + Math.random() * 9000).toString();
    const peerId = 'tesla-mcu2-' + pin;
    
    document.getElementById('carPin').innerText = pin;

    // Connect to PeerJS Free Public Server
    const peer = new Peer(peerId);

    peer.on('open', (id) => {
      console.log('Tesla Car Peer Ready:', id);
    });

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'LOAD_URL') {
          launchApp(data.url);
        } else if (data.type === 'GO_HOME') {
          closeApp();
        }
      });
    });

    function launchApp(url) {
      document.getElementById('appGrid').style.display = 'none';
      const frame = document.getElementById('activeFrame');
      frame.style.display = 'block';
      frame.src = url;
    }

    function closeApp() {
      const frame = document.getElementById('activeFrame');
      frame.src = '';
      frame.style.display = 'none';
      document.getElementById('appGrid').style.display = 'grid';
    }
  </script>
</body>
</html>
