<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cherry Berry Magic Carpet Portal</title>

  <!-- Industrial MQTT Signal Broker -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg-95: rgba(255, 255, 255, 0.05); /* 95% Transparent Ultra-Glass */
      --card-border: rgba(255, 255, 255, 0.15);
      --cherry-red: #d90429;
      --accent-blue: #00e5ff;
      --text-main: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-main); }

    .portal-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; }

    /* HUD Header with Official Tesla Logo */
    .hud-header {
      height: 60px; padding: 0 20px; background: rgba(11, 15, 25, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(12px); z-index: 10; position: relative;
    }
    .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .tesla-logo { width: 20px; height: 20px; fill: var(--cherry-red); }

    .status-pill {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 12px; border-radius: 20px; font-family: monospace; font-size: 13px; font-weight: 700; color: var(--accent-blue);
      display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 10px #10b981; }

    /* Vector/Asset White Model X Hero Stage with Plaid Warp Puddle Light */
    .car-hero-stage {
      position: absolute; top: 60px; left: 0; right: 0; bottom: 0; z-index: 1;
      background-color: #0b0e14;
      background-image: radial-gradient(circle at center, rgba(217, 4, 41, 0.1) 0%, rgba(7, 9, 14, 0.95) 100%),
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%"><defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="%23ffffff" stop-opacity="0.9"/><stop offset="100%" stop-color="%23ffffff" stop-opacity="0"/></radialGradient><linearGradient id="plaid" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%23d90429"/><stop offset="33%" stop-color="%23ffffff"/><stop offset="66%" stop-color="%23000000"/><stop offset="100%" stop-color="%23d90429"/></linearGradient></defs><rect width="1000" height="600" fill="%230b0e14"/><ellipse cx="500" cy="480" rx="350" ry="80" fill="%23000" opacity="0.6"/><path d="M250,380 Q300,220 500,200 Q700,220 750,380 Z" fill="%23f8fafc" stroke="%23cbd5e1" stroke-width="4"/><polygon points="230,380 770,380 800,420 200,420" fill="%230f172a"/><polygon points="200,420 800,420 820,435 180,435" fill="%23000000"/><rect x="420" y="390" width="160" height="25" rx="4" fill="%23ffffff" stroke="%23000" stroke-width="2"/><text x="500" y="408" font-family="monospace" font-weight="900" font-size="16" fill="%23000" text-anchor="middle">R9 HOA</text><circle cx="500" cy="350" r="14" fill="%23ffffff"/><circle cx="500" cy="350" r="25" fill="url(%23glow)"/><circle cx="320" cy="365" r="18" fill="url(%23glow)"/><circle cx="680" cy="365" r="18" fill="url(%23glow)"/><g transform="translate(620, 410) rotate(-15) skewX(-30)"><polygon points="0,0 220,0 260,110 0,110" fill="url(%23plaid)" opacity="0.85" stroke="%23ffffff" stroke-width="2"/></g></svg>');
      background-position: center 20%;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* 95% Transparent Glass App Shelf overlay */
    .app-shelf-overlay {
      position: relative; z-index: 5; flex: 1; margin-top: 60px;
      overflow-y: auto; padding: 240px 16px 40px 16px;
    }

    .app-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 900px; margin: 0 auto;
    }

    /* 95% Glass Bubbles */
    .app-card {
      background: var(--card-bg-95);
      border: 1px solid var(--card-border);
      border-radius: 20px; height: 110px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; cursor: pointer;
      backdrop-filter: blur(16px) saturate(200%);
      -webkit-backdrop-filter: blur(16px) saturate(200%);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .app-card:active {
      transform: scale(0.95);
      background: rgba(217, 4, 41, 0.4);
      border-color: var(--cherry-red);
    }

    .app-card .icon-emoji { font-size: 32px; }
    .app-card span.title { font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

    /* Active Launch Iframe */
    #contentFrame { width: 100%; height: 100%; border: none; display: none; background: #000; z-index: 20; position: absolute; inset: 0; }
  </style>
</head>
<body>

  <div class="portal-container">
    <!-- Header -->
    <div class="hud-header">
      <div class="brand-title">
        <svg class="tesla-logo" viewBox="0 0 342 342">
          <path d="M171 0c-2.7 0-171 21.6-171 21.6l23.5 30.7c0 0 109.8-11.7 147.5-11.7 37.7 0 147.5 11.7 147.5 11.7l23.5-30.7s-168.3-21.6-171-21.6zm0 54.1c-39.7 0-111.4 8.7-111.4 8.7l6.5 30.7c0 0 68.6-8.7 104.9-8.7 36.3 0 104.9 8.7 104.9 8.7l6.5-30.7s-71.7-8.7-111.4-8.7zm0 63.2c-15.6 0-30.5 1.5-44.4 4.1l4.4 171.7h79.9l4.4-171.7c-13.9-2.6-28.8-4.1-44.3-4.1z"/>
        </svg>
        CHERRY BERRY MAGIC CARPET PORTAL
      </div>

      <div class="status-pill">
        <div id="dot" class="status-dot"></div>
        <span>PIN: <span id="pinDisplay">----</span></span>
      </div>
    </div>

    <!-- Vector Background Stage (Embedded SVG rendering guarantees display on MCU2) -->
    <div class="car-hero-stage"></div>

    <!-- 95% Transparent Glass Grid -->
    <div class="app-shelf-overlay">
      <div id="appGrid" class="app-grid">
        <div class="app-card" onclick="launchApp('https://www.youtube.com')">
          <span class="icon-emoji">▶️</span><span class="title">YouTube</span>
        </div>
        <div class="app-card" onclick="launchApp('https://www.netflix.com')">
          <span class="icon-emoji">🎬</span><span class="title">Netflix</span>
        </div>
        <div class="app-card" onclick="launchApp('https://www.primevideo.com')">
          <span class="icon-emoji">📦</span><span class="title">Prime Video</span>
        </div>
        <div class="app-card" onclick="launchApp('https://www.disneyplus.com')">
          <span class="icon-emoji">✨</span><span class="title">Disney+</span>
        </div>
        <div class="app-card" onclick="launchApp('https://www.twitch.tv')">
          <span class="icon-emoji">👾</span><span class="title">Twitch</span>
        </div>
        <div class="app-card" onclick="launchApp('https://app.plex.tv')">
          <span class="icon-emoji">🍿</span><span class="title">Plex</span>
        </div>
        <div class="app-card" onclick="launchApp('https://open.spotify.com')">
          <span class="icon-emoji">🎵</span><span class="title">Spotify</span>
        </div>
        <div class="app-card" onclick="launchApp('https://music.apple.com')">
          <span class="icon-emoji">🍎</span><span class="title">Apple Music</span>
        </div>
        <div class="app-card" onclick="launchApp('https://play.2048.co')">
          <span class="icon-emoji">🎮</span><span class="title">Game 2048</span>
        </div>
      </div>
    </div>

    <iframe id="contentFrame"></iframe>
  </div>

  <script>
    const pin = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('pinDisplay').innerText = pin;

    // Connect via EMQX Secure WebSocket
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const topic = 'cherry_portal_' + pin;

    client.on('connect', () => {
      document.getElementById('dot').classList.add('active');
      client.subscribe(topic);
    });

    client.on('message', (t, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.type === 'LAUNCH') launchApp(data.url);
        if (data.type === 'HOME') closeApp();
        if (data.type === 'FULLSCREEN') triggerFullscreen(data.url);
      } catch(e) {}
    });

    client.on('offline', () => {
      document.getElementById('dot').classList.remove('active');
    });

    function launchApp(targetUrl) {
      // In Motion Video Bypass: Redirect via YouTube host to break out of MCU driver block
      triggerFullscreen(targetUrl);
    }

    function closeApp() {
      const frame = document.getElementById('contentFrame');
      frame.src = '';
      frame.style.display = 'none';
      document.getElementById('appGrid').style.display = 'grid';
    }

    function triggerFullscreen(targetUrl) {
      const encoded = encodeURIComponent(targetUrl || 'https://www.youtube.com');
      window.location.href = `https://www.youtube.com/redirect?q=${encoded}`;
    }
  </script>
</body>
</html>
