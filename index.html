<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherry Portal - Tesla Dashboard</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmpeg-player@1.0.0/jsmpeg.min.js"></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --cherry-red: #d90429;
      --accent-blue: #00e5ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: sans-serif; color: #fff; }

    .hud-header {
      height: 55px; padding: 0 20px; background: rgba(11, 15, 25, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(14px); position: absolute; top: 0; left: 0; right: 0; z-index: 100;
    }
    .brand-title { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: var(--cherry-red); }

    .ip-selector-wrapper { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; }
    .ip-dropdown {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff; padding: 4px 8px; border-radius: 6px; font-family: monospace; outline: none; font-size: 12px;
    }
    .ip-dropdown option { background: #0b0f19; color: #fff; }

    .pin-display {
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--accent-blue);
      padding: 4px 12px; border-radius: 20px; font-family: monospace; font-size: 13px; font-weight: bold; color: var(--accent-blue);
    }

    .canvas-stage {
      width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000;
    }
    canvas { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="hud-header">
    <div class="brand-title">CHERRY PORTAL</div>

    <div class="ip-selector-wrapper">
      <span>SERVER IP:</span>
      <select id="serverIpSelect" class="ip-dropdown">
        <option value="192.168.0.107" selected>192.168.0.107 (Hotspot)</option>
        <option value="192.168.43.1">192.168.43.1</option>
        <option value="192.168.50.1">192.168.50.1</option>
        <option value="10.0.0.1">10.0.0.1</option>
        <option value="127.0.0.1">127.0.0.1</option>
      </select>
    </div>

    <div class="pin-display">PIN: <span id="pinVal">----</span></div>
  </div>

  <div class="canvas-stage">
    <canvas id="video-canvas"></canvas>
  </div>

  <script>
    // Generate Random 4-digit pairing PIN
    const generatedPin = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('pinVal').innerText = generatedPin;

    const topic = 'cherry_portal_' + generatedPin;
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    let player = null;

    client.on('connect', () => {
      client.subscribe(topic);
    });

    client.on('message', (t, msg) => {
      try {
        const data = JSON.parse(msg.toString());
        if (data.type === 'LAUNCH' && data.url) {
          startStream(data.url);
        } else if (data.type === 'HOME') {
          if (player) player.stop();
        }
      } catch (e) {
        console.error("Invalid signal payload", e);
      }
    });

    function startStream(wsUrl) {
      const canvas = document.getElementById('video-canvas');
      if (player) {
        player.destroy();
      }
      player = new JSMpeg.Player(wsUrl, { canvas: canvas, autoplay: true, audio: false });
    }
  </script>
</body>
</html>
