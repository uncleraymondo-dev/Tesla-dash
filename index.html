<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cherry Berry Magic Carpet Portal</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --cherry-red: #d90429;
      --accent-blue: #00e5ff;
      --text-main: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-main); }

    .portal-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; }

    .hud-header {
      height: 60px; padding: 0 20px; background: rgba(11, 15, 25, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(14px); z-index: 10; position: relative;
    }
    .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .tesla-logo { width: 20px; height: 20px; fill: var(--cherry-red); }

    .status-pill {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 12px; border-radius: 20px; font-family: monospace; font-size: 13px; font-weight: 700; color: var(--accent-blue);
      display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 10px #10b981; }

    /* Centered Car Stage (Adapts instantly to half-screen or full-screen expansion) */
    .car-hero-stage {
      position: absolute; top: 60px; left: 0; right: 0; bottom: 0; z-index: 1;
      background: #07090e url('./modelx.jpg') center center / cover no-repeat;
    }

    /* App Shelf Overlay */
    .app-shelf-overlay {
      position: relative; z-index: 5; flex: 1; margin-top: 60px;
      overflow-y: auto; padding: 250px 16px 40px 16px;
    }

    .app-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 900px; margin: 0 auto;
    }

    /* 100% Transparent 3D Jelly Icon Cards */
    .app-card {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px; height: 110px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; cursor: pointer;
      /* 3D Jelly Look: Soft inner glow, multi-layered shadow, crisp backdrop refraction */
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.4), 
        inset 0 -2px 6px rgba(0, 0, 0, 0.5),
        0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .app-card:active {
      transform: scale(0.95);
      background: rgba(217, 4, 41, 0.15);
      border-color: var(--cherry-red);
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.6),
        0 4px 12px rgba(217, 4, 41, 0.4);
    }

    .app-card .icon-emoji { font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
    .app-card span.title { font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }

    #contentFrame { width: 100%; height: 100%; border: none; display: none; background: #000; z-index: 20; position: absolute; inset: 0; }
  </style>
</head>
<body>

  <div class="portal-container">
    <div class="hud-header">
      <div class="brand-title">
        <svg class="tesla-logo" viewBox="0 0 342 342">
          <path d="M171 0c-2.7 0-171 21.6-171 21.6l23.5 30.7c0 0 109.8-11.7 147.5-11.7 37.7 0 147.5 11.7 147.5 11.7l23.5-30.7s-168.3-21.6-171-21.6zm0 54.1c-39.7 0-111.4 8.7-111.4 8.7l6.5 30.7c0 0 68.6-8.7 104.9-8.7 36.3 0 104.9 8.7 104.9 8.7l6.5-30.7s-71.7-8.7-111.4-8.7zm0 63.2c-15.6 0-30.5 1.5-44.4 4.1l4.4 171.7h79.9l4.4-171.7c-13.9-2.6-28.8-4.1-44.3-4.1z"/>
        </svg>
        CHERRY BERRY MAGIC CARPET PORTAL
      </div>

      <div class="status-pill">
        <div id="dot" class="status-dot"></div>
        <span>PIN: <span id="pinDisplay">----</span></span>
      </div>
    </div>

    <div class="car-hero-stage"></div>

    <div class="app-shelf-overlay">
      <div id="appGrid" class="app-grid">
        <div class="app-card" onclick="launchApp('https://www.youtube.com')">
          <span class="icon-emoji">▶️</span><span class="title">YouTube</span>
        </div>
        <div class="app-card" onclick="launchApp('https://www.netflix.com')">
          <span class="icon-emoji">🎬</span><span class="title">Netflix</span>
        </div>
        <div class="app-card" onclick="launchApp('https://www.primevideo.com')">
          <span class="icon-emoji">📦</span><span class="title">Prime Video</span>
        </div>
        <div class="app-card" onclick="launchApp('https://www.disneyplus.com')">
          <span class="icon-emoji">✨</span><span class="title">Disney+</span>
        </div>
        <div class="app-card" onclick="launchApp('https://www.twitch.tv')">
          <span class="icon-emoji">👾</span><span class="title">Twitch</span>
        </div>
        <div class="app-card" onclick="launchApp('https://app.plex.tv')">
          <span class="icon-emoji">🍿</span><span class="title">Plex</span>
        </div>
        <div class="app-card" onclick="launchApp('https://open.spotify.com')">
          <span class="icon-emoji">🎵</span><span class="title">Spotify</span>
        </div>
        <div class="app-card" onclick="launchApp('https://music.apple.com')">
          <span class="icon-emoji">🍎</span><span class="title">Apple Music</span>
        </div>
        <div class="app-card" onclick="launchApp('https://play.2048.co')">
          <span class="icon-emoji">🎮</span><span class="title">Game 2048</span>
        </div>
      </div>
    </div>

    <iframe id="contentFrame"></iframe>
  </div>

  <script>
    const pin = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('pinDisplay').innerText = pin;

    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const topic = 'cherry_portal_' + pin;

    client.on('connect', () => {
      document.getElementById('dot').classList.add('active');
      client.subscribe(topic);
    });

    client.on('message', (t, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.type === 'LAUNCH') launchApp(data.url);
        if (data.type === 'HOME') closeApp();
        if (data.type === 'FULLSCREEN') triggerFullscreen(data.url);
      } catch(e) {}
    });

    client.on('offline', () => {
      document.getElementById('dot').classList.remove('active');
    });

    function launchApp(targetUrl) {
      triggerFullscreen(targetUrl);
    }

    function closeApp() {
      window.location.reload();
    }

    function triggerFullscreen(targetUrl) {
      const dest = targetUrl || 'https://www.youtube.com';
      const encoded = encodeURIComponent(dest);
      window.top.location.href = `https://www.youtube.com/redirect?q=${encoded}`;
    }
  </script>
</body>
</html>
