<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherry Portal - Tesla Dashboard</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmpeg-player@1.0.0/jsmpeg.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #07090e; font-family: sans-serif; color: #fff; }

    .hud-header {
      position: fixed; top: 0; left: 0; right: 0; height: 55px; padding: 0 20px;
      background: rgba(11, 15, 25, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      display: flex; align-items: center; justify-content: space-between; z-index: 1000;
    }
    .brand-title { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #d90429; }
    .ip-display { font-family: monospace; font-size: 12px; color: #00e5ff; }
    .pin-display { background: rgba(255, 255, 255, 0.1); border: 1px solid #00e5ff; padding: 4px 12px; border-radius: 20px; font-family: monospace; font-size: 13px; font-weight: bold; color: #00e5ff; }

    .canvas-stage {
      width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000;
    }
    canvas { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="hud-header">
    <div class="brand-title">CHERRY PORTAL</div>
    <div class="ip-display">SERVER: 192.168.0.107</div>
    <div class="pin-display">PIN: <span id="pinVal">----</span></div>
  </div>

  <div class="canvas-stage">
    <canvas id="video-canvas"></canvas>
  </div>

  <script>
    const generatedPin = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('pinVal').innerText = generatedPin;

    const topic = 'cherry_portal_' + generatedPin;
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    let player = null;

    client.on('connect', () => {
      client.subscribe(topic);
    });

    client.on('message', (t, msg) => {
      try {
        const data = JSON.parse(msg.toString());
        if (data.type === 'LAUNCH' && data.url) {
          startStream(data.url);
        } else if (data.type === 'HOME') {
          if (player) { player.destroy(); player = null; }
        }
      } catch (e) {
        console.error("Payload error", e);
      }
    });

    function startStream(wsUrl) {
      const canvas = document.getElementById('video-canvas');
      if (player) { player.destroy(); }
      player = new JSMpeg.Player(wsUrl, { canvas: canvas, autoplay: true, audio: false });
    }
  </script>
</body>
</html>
